<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e05d38" />
    <meta name="description" content="Salon booking and operations for Kokolett Beauty UK — passwordless for customers, one dashboard for the owner." />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />

    <!-- Preconnect to offloaded services for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />

    <title>Kokolett Beauty UK</title>
    <!--
      Paint the right theme before the first frame.

      React applies the `dark` class after it mounts, which is several hundred
      milliseconds too late: a dark-mode user gets a full-screen white flash on
      every load. This runs synchronously in <head>, reads the same key the
      ThemeProvider writes, and falls back to the operating system. Kept inline
      and tiny on purpose, since a separate request would defeat the point.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kokolett-theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Private mode blocks localStorage; the default light theme is fine. */
        }
      })();
    </script>
  </head>
  <body class="bg-background text-content">
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
