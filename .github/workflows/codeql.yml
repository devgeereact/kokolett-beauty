name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended also reads supabase/functions/**, which is Deno and
          # therefore excluded from npm typecheck and lint — otherwise unchecked.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
