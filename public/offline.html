<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kokolett Beauty UK: offline</title>
    <!--
      The service worker precaches this page, so it is a real screen a real
      customer sees. It cannot import the app's stylesheet (the point is that
      nothing loads), so the brand values are inlined here by hand — taken from
      the same tokens as src/index.css, light and dark. It previously shipped a
      near-black background with an emerald-green button, which belonged to no
      part of this salon's identity.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --background: #e8ebed;
        --foreground: #333333;
        --card: #ffffff;
        --muted-foreground: #5b6370;
        --border: #dcdfe2;
        --brand: #e05d38;
        --primary: #c24d2c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #141a24;
          --foreground: #e8eaed;
          --card: #1c2433;
          --muted-foreground: #a3abb8;
          --border: #2b3547;
          --brand: #e8734f;
          --primary: #e8734f;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 28rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px 32px;
      }
      .wordmark {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 0 24px;
        letter-spacing: -0.01em;
      }
      .wordmark span {
        color: var(--brand);
      }
      h1 {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 1.5rem;
        line-height: 1.2;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted-foreground);
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      button {
        background: var(--primary);
        color: #ffffff;
        border: 0;
        border-radius: 8px;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.95);
      }
      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="wordmark">Kokolett <span>Beauty</span> UK</p>
      <h1>You are offline</h1>
      <p>
        This page has not been saved to your device and there is no connection right now.
        Reconnect and try again. Anything you have already opened still works.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
