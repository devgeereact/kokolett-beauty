name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Appointment maths is timezone-sensitive. Pinning UTC surfaces bugs that a
  # Europe/London machine hides, because BST masks off-by-one-hour errors.
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # 20 is deprecated on GitHub runners: the job still ran, but the
          # actions were silently forced onto Node 24 anyway, so the pinned
          # version was a fiction. 22 is the current LTS and is what the
          # runner will actually use.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Unit tests run under the pinned TZ=UTC above. That is the point: a
      # Europe/London runner would pass the BST cases for the wrong reason.
      - name: Unit tests
        run: npm test

      # These guard the five hookify rules that encode safety lessons this
      # project has already paid for once. They have always passed and have
      # never run in CI, so nothing would have caught them breaking.
      - name: Hookify rule tests
        run: npm run test:hooks

      # `supabase/functions/**` is Deno, so it is invisible to npm typecheck and
      # is in eslint's ignorePatterns. Until this step existed the only thing
      # reading those files was CodeQL's security queries — and a real type
      # error was sitting in ai-assistant-chat unnoticed because of it.
      # --node-modules-dir=none keeps Deno out of the app's node_modules, which
      # it otherwise tries to resolve npm: specifiers against.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `working-directory` is load-bearing: Deno discovers its config from the
      # CWD, not from the file being checked. Run from the repo root and it
      # finds the app's package.json, treats the repo as an npm project, and
      # downloads the whole Vite tree (324 packages, measured) before checking a
      # function that imports none of it — then fails whenever any of them was
      # published in the last 24 hours. From here it reads
      # supabase/functions/deno.json and fetches only the 16 @supabase/*
      # packages that jsr:@supabase/supabase-js actually depends on.
      - name: Typecheck Edge Functions
        working-directory: supabase/functions
        run: |
          for f in */index.ts _shared/*.ts; do
            deno check --no-lock --node-modules-dir=none "$f"
          done

      # `_shared/templates.ts` decides what every customer actually receives and
      # had no tests at all. These are Deno, so `npm test` cannot reach them.
      - name: Edge Function tests
        working-directory: supabase/functions
        run: deno test --no-lock --node-modules-dir=none --allow-read .

      # Deliberately built with no .env present. Vite inlines VITE_* at build
      # time, so real keys here would land in a public log — and would also hide
      # the failure mode that actually matters: a missing variable.
      - name: Build
        run: npm run build

      - name: Assert PWA artefacts exist
        run: |
          test -f dist/sw.js || { echo "::error::dist/sw.js missing — the PWA would work online and silently fail offline"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::dist/manifest.webmanifest missing — the app is not installable"; exit 1; }
          test -f .htaccess || { echo "::error::.htaccess missing — it is not in dist/ and must be copied to the docroot by hand; without it every deep link 404s while the home page works"; exit 1; }

  # Until this job existed, CI ran no SQL at all: a migration that could not
  # apply reached production undetected, which has happened once already (0002
  # created the citext extension after the table that used it). This applies
  # every migration from scratch, in order, and then asserts the security model
  # they describe.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `db start` applies supabase/migrations in filename order against a fresh
      # Postgres. If any migration cannot apply, this step fails and nothing
      # below runs — which is the check that was missing.
      - name: Start Postgres and apply every migration
        run: supabase db start

      # pgTAP suite in supabase/tests/. RLS is the entire security boundary
      # between the shipped anon key and the salon's customer data, and nothing
      # asserted it before this.
      - name: RLS tests
        run: supabase test db

      - name: Stop
        if: always()
        run: supabase stop --no-backup
