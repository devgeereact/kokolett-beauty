version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a week before proposing a newly published version. Compromised
    # releases are typically pulled within days of publication, so the delay
    # costs nothing and takes this repo out of the blast radius of a fresh
    # supply-chain attack. Backported from Vitalcare-Training-Hub.
    cooldown:
      default-days: 7
    # TypeScript 7 is out, and no release of typescript-eslint accepts it —
    # every 8.x still peers `typescript >=4.8.4 <6.1.0`. npm cannot resolve the
    # bump, so Dependabot's whole npm run aborted with
    # `typescript · dependency_file_not_resolvable`, and every other npm
    # update went down with it. Majors are ignored rather than the package:
    # 5.x updates still arrive. Remove this once typescript-eslint ships TS 7
    # support.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A compromised action runs with the workflow's own token.
    cooldown:
      default-days: 7
