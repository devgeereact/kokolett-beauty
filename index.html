<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e05d38" />
    <!--
      Customer-facing, because this is the sentence Google prints under the
      result. It used to describe the software ("passwordless for customers,
      one dashboard for the owner") — accurate for a developer, meaningless to
      somebody looking for a hairdresser.
    -->
    <meta
      name="description"
      content="Kokolett Beauty UK: a women's hair salon in Woolwich, South East London, specialising in braids, locs, weaves, natural hair and colour. Book a real, free time online, no account or password."
    />
    <link rel="canonical" href="https://www.kokolettbeauty.com/" />

    <!-- iOS PWA support.
         Both spellings are needed, and neither is redundant. `mobile-web-app-capable`
         is the standard name; Chrome warns once per page load that the `apple-`
         prefixed one is deprecated. But iOS Safari only honours the `apple-` form for
         standalone mode, so dropping it would take the salon's installed app out of
         full screen and back into a browser chrome on every iPhone it is on. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />

    <!--
      Open Graph and Twitter cards. Without these, every share of the salon's
      link on WhatsApp, Instagram or Facebook renders as a bare URL with no
      title, no description and no image. The retired holding page had them;
      they were lost when the real app replaced it.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kokolett Beauty UK" />
    <meta property="og:title" content="Kokolett Beauty UK: women's hair salon" />
    <meta
      property="og:description"
      content="Braids, locs, weaves, natural hair, colour, cutting and treatments. Book a real, free time online, no account and no password."
    />
    <meta property="og:url" content="https://www.kokolettbeauty.com/" />
    <meta property="og:image" content="https://www.kokolettbeauty.com/icons/pwa-512.png" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kokolett Beauty UK: women's hair salon" />
    <meta
      name="twitter:description"
      content="Braids, locs, weaves, natural hair, colour, cutting and treatments. Book a real, free time online, no account and no password."
    />
    <meta name="twitter:image" content="https://www.kokolettbeauty.com/icons/pwa-512.png" />

    <!--
      Fonts (Inter, Source Serif 4, JetBrains Mono).

      Requested here rather than through an `@import` at the top of
      src/index.css. An `@import` cannot begin until the stylesheet containing
      it has itself downloaded and parsed, so the fonts sat at the end of a
      serial chain on every cold load. A `<link>` in the head starts as soon as
      the HTML is parsed, and the preload ahead of it raises the priority of a
      request the browser would otherwise treat as low.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Source+Serif+4:wght@400;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Source+Serif+4:wght@400;600&display=swap" />

    <title>Kokolett Beauty UK: women's hair salon in South East London</title>
    <!--
      Paint the right theme before the first frame.

      React applies the `dark` class after it mounts, which is several hundred
      milliseconds too late: a dark-mode user gets a full-screen white flash on
      every load. This runs synchronously in <head>, reads the same key the
      ThemeProvider writes, and falls back to the operating system. Kept inline
      and tiny on purpose, since a separate request would defeat the point.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kokolett-theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Private mode blocks localStorage; the default light theme is fine. */
        }
      })();
    </script>

    <!--
      Structured data for the local-business rich result.

      `HairSalon`, not `BeautySalon`: this is a women's hair salon — cutting,
      colouring, styling and treatments. The word "Beauty" in the name is
      branding, not scope, and claiming nails or aesthetics here would be an
      invitation to enquiries the salon cannot serve.

      Static in index.html rather than rendered by React, because the crawlers
      that build this result read the served HTML and this is a client-rendered
      SPA — anything injected after mount is not reliably seen.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "Kokolett Beauty UK",
        "url": "https://www.kokolettbeauty.com",
        "email": "booking@kokolettbeauty.com",
        "image": "https://www.kokolettbeauty.com/icons/pwa-512.png",
        "description": "Women's hair salon in the UK. Braids, locs, colour, cutting, styling and treatments, by appointment.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Redbourne Dr",
          "addressLocality": "London",
          "postalCode": "SE28 8RX",
          "addressCountry": "GB"
        },
        "telephone": "+44 7707 906408",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "08:00",
            "closes": "20:00"
          }
        ],
        "areaServed": { "@type": "Country", "name": "United Kingdom" },
        "currenciesAccepted": "GBP",
        "potentialAction": {
          "@type": "ReserveAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.kokolettbeauty.com/book",
            "actionPlatform": [
              "http://schema.org/DesktopWebPlatform",
              "http://schema.org/MobileWebPlatform"
            ]
          },
          "result": { "@type": "Reservation", "name": "Appointment booking" }
        }
      }
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
