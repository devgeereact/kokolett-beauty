<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e05d38" />
    <meta name="description" content="Salon booking and operations for Kokolett Beauty UK — passwordless for customers, one dashboard for the owner." />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />

    <!-- Preconnect for the Google Fonts request src/index.css makes via
         @import (Inter, Source Serif 4, JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Kokolett Beauty UK</title>
    <!--
      Paint the right theme before the first frame.

      React applies the `dark` class after it mounts, which is several hundred
      milliseconds too late: a dark-mode user gets a full-screen white flash on
      every load. This runs synchronously in <head>, reads the same key the
      ThemeProvider writes, and falls back to the operating system. Kept inline
      and tiny on purpose, since a separate request would defeat the point.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kokolett-theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Private mode blocks localStorage; the default light theme is fine. */
        }
      })();
    </script>

    <!--
      Structured data for the local-business rich result.

      `HairSalon`, not `BeautySalon`: this is a women's hair salon — cutting,
      colouring, styling and treatments. The word "Beauty" in the name is
      branding, not scope, and claiming nails or aesthetics here would be an
      invitation to enquiries the salon cannot serve.

      Static in index.html rather than rendered by React, because the crawlers
      that build this result read the served HTML and this is a client-rendered
      SPA — anything injected after mount is not reliably seen.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "Kokolett Beauty UK",
        "url": "https://www.kokolettbeauty.com",
        "email": "booking@kokolettbeauty.com",
        "image": "https://www.kokolettbeauty.com/icons/pwa-512.png",
        "description": "Women's hair salon in the UK. Braids, locs, colour, cutting, styling and treatments, by appointment.",
        "areaServed": { "@type": "Country", "name": "United Kingdom" },
        "currenciesAccepted": "GBP",
        "potentialAction": {
          "@type": "ReserveAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.kokolettbeauty.com/book",
            "actionPlatform": [
              "http://schema.org/DesktopWebPlatform",
              "http://schema.org/MobileWebPlatform"
            ]
          },
          "result": { "@type": "Reservation", "name": "Appointment booking" }
        }
      }
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
