  :root {
    --background: #e8ebed;
    --foreground: #333333;
    --card: #ffffff;
    --card-foreground: #333333;
    --popover: #ffffff;
    --popover-foreground: #333333;
    --primary: #e05d38;
    --primary-foreground: #ffffff;
    --secondary: #f3f4f6;
    --secondary-foreground: #4b5563;
    --muted: #f9fafb;
    --muted-foreground: #6b7280;
    --accent: #d6e4f0;
    --accent-foreground: #1e3a8a;
    --destructive: #ef4444;
    --destructive-foreground: #ffffff;
    --border: #dcdfe2;
    --input: #f4f5f7;
    --ring: #e05d38;
    --chart-1: #86a7c8;
    --chart-2: #eea591;
    --chart-3: #5a7ca6;
    --chart-4: #466494;
    --chart-5: #334c82;
    --sidebar: #dddfe2;
    --sidebar-foreground: #333333;
    --sidebar-primary: #e05d38;
    --sidebar-primary-foreground: #ffffff;
    --sidebar-accent: #d6e4f0;
    --sidebar-accent-foreground: #1e3a8a;
    --sidebar-border: #c9cdd2;
    --sidebar-ring: #e05d38;
    --status-pending: #d97706;
    --status-confirmed: #2563eb;
    --status-inservice: #7c3aed;
    --status-completed: #059669;
    --status-cancelled: #6b7280;
    --status-noshow: #dc2626;
    --radius: 12px;
    --shadow-card: 0 1px 3px rgb(0 0 0 / 0.1);
    --scrim: rgb(20 20 20 / 0.5);
    --font-sans: 'Inter var', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-serif: 'Source Serif 4 var', 'Source Serif 4', Georgia, 'Iowan Old Style', serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  }

      --secondary: #2a303e;
      --secondary-foreground: #e5e5e5;
      --muted: #2a303e;
      --muted-foreground: #a3a3a3;
      --accent: #2a3656;
      --accent-foreground: #bfdbfe;
      --border: #3d4354;
      --input: #3d4354;
      --chart-2: #e6a08f;
      --sidebar: #2a303f;
      --sidebar-foreground: #e5e5e5;
      --sidebar-accent: #2a3656;
      --sidebar-accent-foreground: #bfdbfe;
      --sidebar-border: #3d4354;
      --status-pending: #f59e0b;
      --status-confirmed: #60a5fa;
      --status-inservice: #a78bfa;
      --status-completed: #34d399;
      --status-cancelled: #9ca3af;

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: color-mix(in srgb, var(--primary) 30%, transparent); }
  :focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
    border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }

  .app { display: grid; grid-template-columns: 264px 1fr; min-height: 100dvh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--sidebar);
    color: var(--sidebar-foreground);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    gap: 18px;
    position: sticky;
    top: 0;
    height: 100dvh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 8px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--sidebar-primary); color: var(--sidebar-primary-foreground);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif); font-weight: 600; font-size: 16px; flex: none;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-name { font-family: var(--font-serif); font-weight: 600; font-size: 15.5px; }

  /* ---------------- Reports ---------------- */
  function renderReports() {
    var el = document.getElementById('view-reports');
    var completed = APPOINTMENTS.filter(function (a) { return a.status === 'completed'; });
    var revenue = completed.reduce(function (s, a) { return s + a.price; }, 0);
    var totalBooked = APPOINTMENTS.filter(function (a) { return a.status !== 'cancelled' && a.status !== 'rejected'; }).length;
    var returning = CUSTOMERS.filter(function (c) { return c.visits > 1; }).length;
    var returningRate = Math.round((returning / CUSTOMERS.length) * 100);
    var cancelled = APPOINTMENTS.filter(function (a) { return a.status === 'cancelled'; }).length;
    var noShow = APPOINTMENTS.filter(function (a) { return a.status === 'no_show'; }).length;
    var cancelRate = Math.round((cancelled / APPOINTMENTS.length) * 100);
    var noShowRate = Math.round((noShow / APPOINTMENTS.length) * 100);
    var avgBooking = completed.length ? Math.round(revenue / completed.length) : 0;

    var head = '<div class="view-head"><div><h1 class="view-title">Reports</h1><p class="view-desc">Revenue and utilisation, computed from this week\'s bookings.</p></div></div>';
    var stats = '<div class="stat-grid">' +
      stat('Revenue (completed)', fmtGBP(revenue)) +
      stat('Bookings', String(totalBooked)) +
      stat('Returning-customer rate', returningRate + '%') +
      stat('Avg booking value', fmtGBP(avgBooking)) +
      stat('Cancellation rate', cancelRate + '%') +
      stat('No-show rate', noShowRate + '%') +
      '</div>';

    var byDay = {};
    WEEK_DAYS.forEach(function (d) { byDay[d] = 0; });
    APPOINTMENTS.forEach(function (a) { if (a.status !== 'cancelled' && a.status !== 'rejected') byDay[WEEK_DAYS[(a.date.getDay() + 6) % 7]]++; });
    var byHour = {};
    ['09:00', '11:00', '13:00', '15:00', '17:00'].forEach(function (h) { byHour[h] = 0; });
    APPOINTMENTS.forEach(function (a) { if (byHour[a.time] !== undefined && a.status !== 'cancelled' && a.status !== 'rejected') byHour[a.time]++; });

    var charts = '<div class="grid-2">' +
      chartCard('Bookings by day of week', byDay, 'var(--chart-1)') +
      chartCard('Bookings by time slot', byHour, 'var(--chart-3)') +
      '</div>';

    var top = CUSTOMERS.slice().sort(function (a, b) { return b.visits - a.visits; }).slice(0, 5);
    var topTable = '<div class="card" style="margin-top:16px;"><div class="card-pad" style="padding-bottom:0;"><h3 style="font-size:14.5px;">Top customers</h3></div>' +
      '<div class="table-wrap" style="border:none;"><table><thead><tr><th>Customer</th><th>Visits</th><th>Lifetime spend</th></tr></thead><tbody>' +
      top.map(function (c) { return '<tr><td class="cell-primary">' + esc(c.name) + '</td><td>' + c.visits + '</td><td class="mono">' + fmtGBP(c.visits * 8200) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';

    el.innerHTML = head + stats + charts + topTable;
  }
  function stat(label, value) { return '<div class="card stat-card"><div class="stat-label">' + esc(label) + '</div><div class="stat-value">' + esc(value) + '</div></div>'; }
  function chartCard(title, data, color) {
    var max = Math.max.apply(null, Object.keys(data).map(function (k) { return data[k]; })) || 1;
    var bars = Object.keys(data).map(function (k) {
      var v = data[k];
      var h = Math.max(4, Math.round((v / max) * 120));
      return '<div class="bar-col"><span class="bar-value">' + v + '</span><div class="bar-rect" style="height:' + h + 'px;background:' + color + ';"></div><span class="bar-label">' + (k.length > 3 ? k.slice(0, 3) : k) + '</span></div>';
    }).join('');
    return '<div class="card card-pad"><h3 style="font-size:14.5px;margin-bottom:4px;">' + esc(title) + '</h3><div class="bar-chart">' + bars + '</div></div>';
  }

        '<div class="rec-icon" style="width:32px;height:32px;">' + ICONS[iconFor[n.type]] + '</div>' +
        '<div style="flex:1;"><div class="row-flex" style="justify-content:space-between;">' +
        '<strong style="font-size:13.5px;">' + esc(n.title) + '</strong><span class="cell-muted">' + fmtDateShort(n.time) + '</span></div>' +
        '<p class="cell-muted" style="margin-top:2px;">' + esc(n.body) + '</p></div>' +
        (n.read ? '' : '<span class="icon-dot" style="position:static;border:none;"></span>') + '</div>';
    }).join('') : emptyRow('Nothing here.')) + '</div>';
    el.innerHTML = head + pills + body;
  }

  /* ---------------- Settings ---------------- */
  function renderSettings() {
    var el = document.getElementById('view-settings');
    var tabs = [['profile', 'Salon profile'], ['policy', 'Booking policy'], ['appearance', 'Appearance']];
    var head = '<div class="view-head"><div><h1 class="view-title">Settings</h1></div></div>';
    var pills = '<div class="pill-row">' + tabs.map(function (t) {
      return '<button class="pill-filter" data-action="settings-tab" data-tab="' + t[0] + '" aria-pressed="' + (state.settingsTab === t[0]) + '">' + t[1] + '</button>';
    }).join('') + '</div>';

    var panel = '';
    if (state.settingsTab === 'profile') {
      panel = '<div class="card card-pad" style="max-width:560px;">' +
        field('Salon name', '<input id="setName" value="' + esc(SETTINGS.salonName) + '" />') +
        field('Contact email', '<input id="setEmail" type="email" value="' + esc(SETTINGS.email) + '" />') +
        field('Phone', '<input id="setPhone" value="' + esc(SETTINGS.phone) + '" />') +
        field('Address', '<input id="setAddress" value="' + esc(SETTINGS.address) + '" />') +
        '<div class="field"><label>Shareable booking link</label><div class="row-flex">' +
        '<input readonly value="' + esc(SETTINGS.bookingLink) + '" style="flex:1;" />' +
        '<button class="btn btn-secondary btn-sm" data-action="copy-link">' + ICONS.copy + ' Copy</button></div></div>' +
        '<button class="btn btn-primary" data-action="save-settings">Save changes</button></div>';
    } else if (state.settingsTab === 'policy') {
      panel = '<div class="card card-pad" style="max-width:560px;">' +
        field('Booking policy shown to customers', '<textarea id="setPolicy" style="min-height:140px;">' + esc(SETTINGS.policy) + '</textarea>') +
        '<button class="btn btn-primary" data-action="save-settings">Save changes</button></div>';
    } else {
      panel = '<div class="card card-pad" style="max-width:420px;">' +
        ['system', 'light', 'dark'].map(function (t) {
          return '<label class="switch-row" style="cursor:pointer;"><span style="text-transform:capitalize;font-size:13.5px;">' + t + '</span>' +
            '<input type="radio" name="themePref" value="' + t + '" ' + (state.theme === t ? 'checked' : '') + ' data-action="set-theme" style="width:18px;height:18px;" /></label>';
        }).join('') + '</div>';
    }
    el.innerHTML = head + pills + panel;
  }

  /* ---------------- Renderers map ---------------- */
  var RENDERERS = {
    today: renderToday, calendar: renderCalendar, approvals: renderApprovals, appointments: renderAppointments,
    requests: renderRequests, customers: renderCustomers, services: renderServices, availability: renderAvailability,
    reports: renderReports, assistant: renderAssistant, notifications: renderNotifications, settings: renderSettings
  };

  /* ---------------- Event delegation ---------------- */
  function onClick(e) {
    var t = e.target.closest('[data-action]');
    if (!t) {
      // click outside decline confirm resets it
      return;
    }
    var action = t.dataset.action;
    switch (action) {
      case 'goto': switchView(t.dataset.view); renderNav(); break;
      case 'approve': {
        var a = APPOINTMENTS.find(function (x) { return x.id === t.dataset.id; });
        if (a) { a.status = 'confirmed'; toast('Booking confirmed', a.customer.name + ' will get an email now.'); }
        renderApprovals(); renderNav();
        break;
      }
      case 'decline-ask': {
        var wrap = t.closest('[data-confirm-slot]');
        wrap.innerHTML = '<span class="cell-muted" style="align-self:center;">Decline this booking?</span>' +
          '<button class="btn btn-destructive btn-sm" data-action="decline-confirm" data-id="' + t.dataset.id + '">Yes, decline</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="decline-cancel">Cancel</button>';
        break;
      }
      case 'decline-cancel': renderApprovals(); break;
      case 'decline-confirm': {
        var a2 = APPOINTMENTS.find(function (x) { return x.id === t.dataset.id; });
        if (a2) { a2.status = 'rejected'; toast('Booking declined', a2.customer.name + ' will be notified.'); }
        renderApprovals(); renderNav();
        break;
      }
      case 'filter-appt': apptStatusFilter = t.dataset.status; renderAppointments(); break;
      case 'request-tab': state.requestTab = t.dataset.tab; renderRequests(); break;
      case 'offer-slot': {
        var r = REQUESTS.find(function (x) { return x.id === t.dataset.id; });
        if (r) { r.status = 'converted'; toast('Slot offered', r.name + ' will get a secure booking link.'); }
        renderRequests();
        break;
      }
      case 'decline-request': {
        var r2 = REQUESTS.find(function (x) { return x.id === t.dataset.id; });
        if (r2) { r2.status = 'declined'; toast('Request declined'); }
        renderRequests();
        break;
      }
      case 'open-customer': openCustomerDrawer(t.dataset.id); break;
      case 'close-drawer': closeCustomerDrawer(); break;
      case 'add-service': openServiceModal(null); break;
      case 'edit-service': openServiceModal(t.dataset.id); break;
      case 'close-modal': closeServiceModal(); break;
      case 'add-closure': {
        var reason = window.prompt ? null : null;
        CLOSURES.push({ id: 'cl' + (CLOSURES.length + 1), date: 'TBC', reason: 'New closure' });
        toast('Closure added', 'Update the date and reason.');
        renderAvailability();
        break;
      }
      case 'remove-closure': {
        var idx = CLOSURES.findIndex(function (c) { return c.id === t.dataset.id; });
        if (idx > -1) CLOSURES.splice(idx, 1);
        renderAvailability();
        break;
      }
      case 'accept-rec': {
        var rec = RECOMMENDATIONS.find(function (x) { return x.id === t.dataset.id; });
        if (rec) { rec.status = 'accepted'; toast('Recommendation accepted'); }
        renderAssistant();
        break;
      }
      case 'dismiss-rec': {
        var rec2 = RECOMMENDATIONS.find(function (x) { return x.id === t.dataset.id; });
        if (rec2) { rec2.status = 'dismissed'; toast('Recommendation dismissed'); }
        renderAssistant();
        break;
      }
      case 'mark-read': {
        var n = NOTIFICATIONS.find(function (x) { return x.id === t.dataset.id; });
        if (n) n.read = true;
        renderNotifications(); renderNav();
        break;
      }
      case 'notif-filter': state.notifFilter = t.dataset.filter; renderNotifications(); break;
      case 'settings-tab': state.settingsTab = t.dataset.tab; renderSettings(); break;
      case 'copy-link': {
        var link = SETTINGS.bookingLink;
        if (navigator.clipboard) navigator.clipboard.writeText(link).catch(function () {});
        toast('Link copied', link);
        break;
      }
      case 'save-settings': {
        var nameEl = document.getElementById('setName');
        if (nameEl) SETTINGS.salonName = nameEl.value;
        var emailEl = document.getElementById('setEmail'); if (emailEl) SETTINGS.email = emailEl.value;
        var phoneEl = document.getElementById('setPhone'); if (phoneEl) SETTINGS.phone = phoneEl.value;
        var addrEl = document.getElementById('setAddress'); if (addrEl) SETTINGS.address = addrEl.value;
        var polEl = document.getElementById('setPolicy'); if (polEl) SETTINGS.policy = polEl.value;
        toast('Settings saved');
        break;
      }
      default: break;
    }
  }

  function onChange(e) {
    var t = e.target;
    if (t.dataset.action === 'toggle-service') {
      var s = SERVICES.find(function (x) { return x.id === t.dataset.id; });
      if (s) { s.active = t.checked; toast(s.active ? 'Service active' : 'Service archived', s.name); }
    } else if (t.dataset.action === 'toggle-day') {
      var d = AVAILABILITY.find(function (x) { return x.day === t.dataset.day; });
      if (d) { d.open = t.checked; toast(d.open ? d.day + ' is open' : d.day + ' is closed'); renderAvailability(); }
    } else if (t.dataset.action === 'set-theme') {
      applyTheme(t.value);
      renderSettings();
    } else if (t.dataset.action === 'filter-appt' || t.dataset.action === 'request-tab') {
      // handled in click
    }
  }

  /* ---------------- Init ---------------- */
  function init() {
    buildShell();
    renderNav();
    switchView('today');

    document.getElementById('content').addEventListener('click', onClick);
    document.getElementById('content').addEventListener('change', onChange);
    document.getElementById('mainNav').addEventListener('click', function (e) {
      var b = e.target.closest('.nav-item');
      if (b) switchView(b.dataset.view), renderNav();
    });

    document.getElementById('customerDrawerOverlay').addEventListener('click', function (e) {
      if (e.target.id === 'customerDrawerOverlay') closeCustomerDrawer();
    });
    document.getElementById('customerDrawer').addEventListener('click', onClick);
    document.getElementById('serviceModalOverlay').addEventListener('click', function (e) {
      if (e.target.id === 'serviceModalOverlay') closeServiceModal();
    });
    document.getElementById('serviceModal').addEventListener('click', onClick);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeCustomerDrawer(); closeServiceModal(); }
    });

    var navToggle = document.getElementById('navToggle');
    navToggle.innerHTML = ICONS.sliders;
    navToggle.addEventListener('click', function () {
      var open = document.body.classList.toggle('nav-open');
      navToggle.setAttribute('aria-expanded', String(open));
    });
    document.getElementById('navScrim').addEventListener('click', function () { document.body.classList.remove('nav-open'); });

    document.getElementById('themeToggle').addEventListener('click', function () {
      var order = ['system', 'light', 'dark'];
      var next = order[(order.indexOf(state.theme) + 1) % order.length];
      applyTheme(next);
      if (state.view === 'settings') renderSettings();
    });

    document.getElementById('notifBtn').innerHTML = ICONS.bell;
    document.getElementById('notifBtn').addEventListener('click', function () { switchView('notifications'); renderNav(); });
    document.getElementById('profileBtn').addEventListener('click', function () { switchView('settings'); renderNav(); });
    document.getElementById('chevronDown').innerHTML = ICONS.chevronDown;
    document.querySelector('.search-field svg, .search-field span').outerHTML = ICONS.search;

    document.getElementById('globalSearch').addEventListener('input', function (e) {
      state.searchQuery = e.target.value;
      if (state.view === 'appointments') renderAppointments();
      else if (state.view === 'customers') renderCustomers();
    });

    var savedTheme = 'system';
    try { savedTheme = localStorage.getItem('kokolett-proto-theme') || 'system'; } catch (e) {}
    applyTheme(savedTheme);

    setInterval(function () {
      if (state.view === 'approvals') renderApprovals();
    }, 60000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
