*{box-sizing:border-box;}

body{

.text-xs{font-size:12px;} .text-sm{font-size:14px;} .text-base{font-size:16px;}
.text-lg{font-size:18px;} .text-xl{font-size:20px;} .text-2xl{font-size:24px;}

.flex{display:flex;} .flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;} .items-start{align-items:flex-start;} .items-end{align-items:flex-end;}
.justify-between{justify-content:space-between;} .justify-center{justify-content:center;} .justify-end{justify-content:flex-end;}
.flex-wrap{flex-wrap:wrap;}
.gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;} .gap-5{gap:20px;} .gap-6{gap:24px;}
.stack{display:flex;flex-direction:column;}
.row{display:flex;flex-direction:row;}
.grid{display:grid;gap:16px;}

.btn{

.badge-pending{color:var(--status-pending); background:color-mix(in srgb, var(--status-pending) 14%, var(--card)); border-color:color-mix(in srgb, var(--status-pending) 35%, transparent);}
.badge-confirmed{color:var(--status-confirmed); background:color-mix(in srgb, var(--status-confirmed) 14%, var(--card)); border-color:color-mix(in srgb, var(--status-confirmed) 35%, transparent);}
.badge-inservice{color:var(--status-inservice); background:color-mix(in srgb, var(--status-inservice) 14%, var(--card)); border-color:color-mix(in srgb, var(--status-inservice) 35%, transparent);}
.badge-completed{color:var(--status-completed); background:color-mix(in srgb, var(--status-completed) 14%, var(--card)); border-color:color-mix(in srgb, var(--status-completed) 35%, transparent);}
.badge-cancelled{color:var(--status-cancelled); background:color-mix(in srgb, var(--status-cancelled) 14%, var(--card)); border-color:color-mix(in srgb, var(--status-cancelled) 35%, transparent);}
.badge-noshow{color:var(--status-noshow); background:color-mix(in srgb, var(--status-noshow) 14%, var(--card)); border-color:color-mix(in srgb, var(--status-noshow) 35%, transparent);}
.badge-neutral{color:var(--muted-foreground); background:var(--muted); border-color:var(--border);}
.badge-accent{color:var(--accent-foreground); background:var(--accent); border-color:transparent;}

label{display:block; font-size:13px; font-weight:500; margin-bottom:6px;}

  width:100%; font-family:inherit; font-size:14px; padding:10px 12px; border-radius:var(--r-md);

}

let uidCounter = 1000;

function refCode(){ const s='ACDEFGHJKLMNPQRSTUVWXYZ2345679'; let r=''; for(let i=0;i<6;i++) r+=s[Math.floor(Math.random()*s.length)]; return 'KB-'+r; }
function pad(n){ return n<10?'0'+n:''+n; }
function toISODate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addMinutesToTime(hhmm,min){ const [h,m]=hhmm.split(':').map(Number); const total=h*60+m+min; const nh=Math.floor(total/60)%24; const nm=total%60; return pad(nh)+':'+pad(nm); }
function timeToMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function money(pence){ if(pence==null) return null; return new Intl.NumberFormat('en-GB', { style:'currency', currency:'GBP' }).format(pence/100); }
function fmtDateLong(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function fmtDateShort(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
function fmtMonthYear(d){ return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function timeAgo(iso){
  const diff = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(diff < 1) return 'just now';
  if(diff < 60) return diff+'m ago';
  if(diff < 1440) return Math.round(diff/60)+'h ago';
  return Math.round(diff/1440)+'d ago';
}
function fmtDuration(mins){
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return h+'h '+m+'m';
  if(h) return h+' hour'+(h===1?'':'s');
  return m+' minute'+(m===1?'':'s');
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function initials(name){ return name.split(' ').filter(Boolean).map(p=>p[0]).join('').slice(0,2).toUpperCase(); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }

/* ---------- availability: "a day is a list of start times" (migration 0011) ---------- */
/* weekly_template is a generator only, never consulted at booking time — it writes real rows into availability_slots */
const weeklyTemplate = {
  0:[], /* Sunday — closed */
  1:[], /* Monday — closed */
  2:['09:00','10:15','11:30','13:00','14:15','15:30'],
  3:['09:00','10:15','11:30','13:00','14:15','15:30','17:00'],

};
const dayDecided = new Set();
const availabilityByDate = {};
const closedDates = new Set([ toISODate(addDays(today,20)) ]); /* owner blocked this day explicitly */
function generateFromTemplate(dateStr){
  const dow = new Date(dateStr+'T00:00:00').getDay();
  return closedDates.has(dateStr) ? [] : weeklyTemplate[dow].slice();
}
for(let i=0;i<businessSettings.publishedHorizonDays;i++){
  const d = toISODate(addDays(today,i));
  availabilityByDate[d] = generateFromTemplate(d);
  dayDecided.add(d);
}
function isPublished(dateStr){ return dayDecided.has(dateStr); }
function isWithinHorizon(dateStr){ return new Date(dateStr) <= addDays(today, businessSettings.maxHorizonDays); }

function bookedTimesForDate(dateStr){ return appointments.filter(a=>a.date===dateStr && LIVE_STATUSES.includes(a.status)).map(a=>a.time); }
function openSlotsForDate(dateStr){
  if(!isPublished(dateStr) || !isWithinHorizon(dateStr) || closedDates.has(dateStr)) return [];
  const liveToday = appointments.filter(a=>a.date===dateStr && LIVE_STATUSES.includes(a.status));
  if(liveToday.length >= businessSettings.maxAppointmentsPerDay) return [];
  let list = (availabilityByDate[dateStr]||[]).slice();
  list = list.filter(t=>{
    const tStart = timeToMinutes(t), tEnd = tStart + bookableService.durationMin;
    return !liveToday.some(a=>{
      const aStart = timeToMinutes(a.time), aEnd = aStart + bookableService.durationMin + bookableService.bufferMin;
      return tStart < aEnd && aStart < tEnd;
    });
  });
  if(dateStr===todayISO) list = list.filter(t=> timeToMinutes(t) >= nowMin + businessSettings.leadTimeMin);
  return list;
}
function endTime(a){ return addMinutesToTime(a.time, bookableService.durationMin); }
function isFirstTime(customerId){ return !appointments.some(a=>a.customerId===customerId && a.status==='completed'); }
function visitsCompleted(customerId){ return appointments.filter(a=>a.customerId===customerId && a.status==='completed').length; }
function lifetimeSpend(customerId){ return appointments.filter(a=>a.customerId===customerId && a.status==='completed' && a.pricePence!=null).reduce((s,a)=>s+a.pricePence,0); }
function rescheduledInto(apptId){ return appointments.find(a=>a.rescheduledFrom===apptId); }

/* weekday-anchored helper so seed times land on real published slots */
function weekdayTime(offsetDays, slotIndex){
  const d = toISODate(addDays(today, offsetDays));
  const dow = new Date(d+'T00:00:00').getDay();
  const times = weeklyTemplate[dow].length ? weeklyTemplate[dow] : ['10:00'];
  return { date:d, time: times[slotIndex % times.length] };
}

const appointments = [];
function seedAppt(offset, slotIx, customerId, status, extra){
  const {date, time} = weekdayTime(offset, slotIx);
  const a = Object.assign({
    id: uid('apt'), ref: refCode(), customerId, date, time, status,
    source: 'online', customerNote:'', ownerNote:'', pricePence:null,
    rescheduledFrom:null, cancellationReason:null, rejectionReason:null,
    createdAt: addDays(today, offset - 3).toISOString(),
  }, extra||{});
  appointments.push(a);
  return a;
}

  });

});

/* 1. schedule conflict detection — the DB's exclusion constraint blocks normal double-booking; the only way two live
      appointments now overlap is a manual owner/phone booking (create_appointment_as_owner bypasses it on purpose) */
function findConflicts(){
  const byDate = {};
  appointments.filter(a=>LIVE_STATUSES.includes(a.status)).forEach(a=>{ (byDate[a.date]=byDate[a.date]||[]).push(a); });
  const conflicts = [];
  Object.values(byDate).forEach(list=>{
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
      const a=list[i], b=list[j];
      const aS=timeToMinutes(a.time), aE=aS+bookableService.durationMin;
      const bS=timeToMinutes(b.time), bE=bS+bookableService.durationMin;
      if(aS < bE && bS < aE) conflicts.push([a,b]);
    }
  });
  return conflicts;
}

/* 2. intelligent rescheduling suggestions — scans real published availability, not a generic open/close range */
function suggestSlots(targetAppt, count){
  count = count || 5;
  const results = [];
  for(let d=1; d<=businessSettings.publishedHorizonDays && results.length<count; d++){
    const date = toISODate(addDays(today, d));
    openSlotsForDate(date).forEach(t=>{ if(results.length<count && !(date===targetAppt.date && t===targetAppt.time)) results.push({date, time:t}); });
  }
  return results.slice(0, count);
}

/* 3. cancellation forecasting */
function riskScore(a){
  if(!LIVE_STATUSES.includes(a.status)) return 0;
  let score = 8;
  if(isFirstTime(a.customerId)) score += 30;
  const leadDays = Math.round((new Date(a.date) - new Date(a.createdAt))/86400000);
  if(leadDays <= 1) score += 22; else if(leadDays<=3) score += 10;
  const c = cust(a.customerId);
  if(/no-show/i.test(c.notes)) score += 24;
  if(appointments.some(x=>x.customerId===a.customerId && x.status==='no_show')) score += 12;
  if(a.source==='phone') score -= 6;
  return clamp(score, 4, 96);
}
function riskBand(score){ return score>=60?'High':score>=32?'Medium':'Low'; }
function riskColor(score){ return score>=60?'var(--status-noshow)':score>=32?'var(--status-pending)':'var(--status-completed)'; }
function cancellationForecast(){
  return appointments.filter(a=>LIVE_STATUSES.includes(a.status) && new Date(a.date)>=today)
    .map(a=>({a, score: riskScore(a)})).sort((x,y)=>y.score-x.score);
}

/* 5. business analytics + 6. trend analysis — aligned to the metrics PRD.md §8 actually lists */
function monthKey(dateStr){ return dateStr.slice(0,7); }
function businessAnalytics(){
  const thisMonth = monthKey(todayISO);
  const monthAppts = appointments.filter(a=>monthKey(a.date)===thisMonth);
  const completed = appointments.filter(a=>a.status==='completed');
  const noshow = appointments.filter(a=>a.status==='no_show').length;
  const cancelled = appointments.filter(a=>a.status==='cancelled'||a.status==='rejected').length;
  const returning = completed.length ? Math.round(100*completed.filter(a=>visitsCompleted(a.customerId)>1).length/completed.length) : 0;
  const revenueKnown = completed.filter(a=>a.pricePence!=null);
  const revenue = revenueKnown.reduce((s,a)=>s+a.pricePence,0);
  const noShowRate = completed.length+noshow>0 ? Math.round(100*noshow/(completed.length+noshow)) : 0;
  const cancelRate = appointments.length ? Math.round(100*cancelled/appointments.length) : 0;
  return { bookingsThisMonth: monthAppts.length, revenue, revenueSampleSize:revenueKnown.length, returningRate:returning, noShowRate, cancelRate, totalBookings:appointments.length };
}
function trendByWeekday(){
  const counts = [0,0,0,0,0,0,0];
  appointments.forEach(a=>{ const d=new Date(a.date+'T00:00:00').getDay(); counts[(d+6)%7]++; });
  return counts;
}
function trendByHour(){
  const buckets = {};
  appointments.forEach(a=>{ const h=timeToMinutes(a.time)/60|0; buckets[h]=(buckets[h]||0)+1; });
  return buckets;
}

const REPLY_TONES = ['Friendly','Formal','Brief'];
function suggestReply(message, tone){
  const c = msgCust(message); const first = firstName(c);
  const text = message.text.toLowerCase();
  let core;
  if(text.includes('late')) core = "no problem at all — thank you for the heads-up, we'll be ready whenever you arrive";
  else if(text.includes('cancel')) core = "that's absolutely fine, I've noted the cancellation — hope everything's alright";
  else if(text.includes('extra') || text.includes('time')) core = "let's plan for that on the day — just flag it when you arrive and we'll make sure there's room";
  else core = "thanks so much for letting us know, we've made a note on your appointment";
  if(tone==='Formal') return `Dear ${first},<br><br>Thank you for your message — ${core}. Please do not hesitate to get in touch with any further questions.<br><br>Kind regards,<br>Kokolett Beauty UK`;
  if(tone==='Brief') return `Hi ${first} — ${core}. Speak soon!`;
  return `Hi ${first},<br><br>${core[0].toUpperCase()+core.slice(1)}.<br><br>See you soon.`;
}

/* ---------- router ---------- */
function navigate(hash){ if(location.hash===hash){ render(); } else { location.hash = hash; } try{ window.scrollTo({top:0}); }catch(e){} }
function seg(){ return (location.hash.slice(1)||'/').split('/').filter(Boolean); }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{ setThemePref(getThemePref()); render(); });

function render(){
  const s = seg();
  const app = document.getElementById('app');
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const selStart = focusId && 'selectionStart' in active ? active.selectionStart : null;
  let html;
  if(s[0]==='owner') html = renderOwner(s.slice(1));
  else if(s[0]==='book') html = wrapPublic(renderBook(s.slice(1)));
  else if(s[0]==='manage') html = wrapPublic(renderManage(s.slice(1)));
  else if(s[0]==='history') html = wrapPublic(renderHistory(s.slice(1)));
  else html = wrapPublic(renderLanding());
  app.innerHTML = html;
  document.getElementById('theme-btn') && (document.getElementById('theme-btn').innerHTML = themeIcon());
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){ el.focus(); if(selStart!=null && 'setSelectionRange' in el){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  }
  app.querySelectorAll('[data-nav], [data-action]').forEach(el=>{
    const tag = el.tagName;
    if(tag==='A' || tag==='BUTTON' || tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') return;
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role', el.hasAttribute('data-nav') ? 'link' : 'button');
    if(!el.style.cursor) el.style.cursor='pointer';
  });
}
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target.closest('[data-nav],[data-action]');
  if(!el) return;
  const tag = el.tagName;
  if(tag==='A' || tag==='BUTTON' || tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') return;
  e.preventDefault(); el.click();
});

/* ================= booking flow ================= */
function stepper(active){
  const steps = ['Browse','Date','Time','Details','Review'];
  const order = ['browse','date','time','details','review'];
  const ix = order.indexOf(active);
  return `<div class="stepper">${steps.map((label,i)=>{
    const state = i<ix?'done':i===ix?'active':'';
    const clickable = i<ix;
    return `<div class="step ${state}" ${clickable?`data-nav="#/book/${order[i]}"`:''}><span class="step-num">${i<ix?icon('check'):i+1}</span><span>${label}</span></div>${i<steps.length-1?'<span class="step-sep"></span>':''}`;
  }).join('')}</div>`;
}
function renderBook(parts){
  const step = parts[0] || 'browse';
  if((step==='time'||step==='details'||step==='review'||step==='waitlist-form') && !draft.date) return bookGuard('Choose a date first.', '#/book/date');
  if((step==='details'||step==='review') && !draft.time) return bookGuard('Choose a time first.', '#/book/time');
  if(step==='review' && !(draft.name && draft.email)) return bookGuard('Add your details first.', '#/book/details');
  if(step==='browse') return bookBrowse();
  if(step==='date') return bookDate();
  if(step==='time') return bookTime();
  if(step==='details') return bookDetails();
  if(step==='review') return bookReview();
  if(step==='submitted') return bookSubmitted(parts[1]);
  if(step==='approved') return bookApproved(parts[1]);
  if(step==='waitlisted') return bookWaitlisted(parts[1]);
  if(step==='waitlist-form') return bookWaitlistForm();
  return bookBrowse();
}
function bookGuard(msg, hash){
  return `<div class="book-wrap"><div class="empty-state">${icon('warning')}<p class="fw-medium">${esc(msg)}</p>
    <button class="btn btn-primary" style="margin-top:16px;" data-nav="${hash}">Continue</button></div></div>`;
}

  </div>`;

function monthGridPublic(cursor, selectDate){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = []; for(let i=0;i<startOffset;i++) cells.push(null); for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const rows = []; for(let i=0;i<cells.length;i+=7) rows.push(cells.slice(i,i+7));
  const maxDate = addDays(today, businessSettings.maxHorizonDays);
  return `<div class="month-nav">
      <button class="icon-btn" data-action="cal-prev">${icon('chevronLeft')}</button>
      <div class="fw-semibold">${fmtMonthYear(cursor)}</div>
      <button class="icon-btn" data-action="cal-next">${icon('chevronRight')}</button>
    </div>
    <div style="overflow-x:auto;"><table class="cal-table"><thead><tr>${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<th>${d}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(row=>`<tr>${row.map(d=>{
      if(d===null) return '<td class="blank"></td>';
      const dateObj = new Date(y,m,d);
      const dateStr = toISODate(dateObj);
      const past = dateObj < today;
      const tooFar = dateObj > maxDate;
      const disabled = past || tooFar;
      const isToday = dateStr===todayISO;
      const isSel = dateStr===selectDate;
      const openCount = disabled ? 0 : openSlotsForDate(dateStr).length;
      const published = isPublished(dateStr);
      let dot = '';
      if(!disabled) dot = openCount>0 ? '<span class="cal-dot"></span>' : (published ? '' : '');
      return `<td><button class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" ${disabled?'disabled':''} data-action="pick-date" data-date="${dateStr}">${d}${dot}</button></td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- owner: calendar ---------- */
function ownerCalendar(){
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = []; for(let i=0;i<startOffset;i++) cells.push(null); for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const rows = []; for(let i=0;i<cells.length;i+=7) rows.push(cells.slice(i,i+7));
  return `
  ${pageHeader('', 'Calendar', `<button class="btn btn-outline" data-nav="#/owner/today">Today</button>`)}
  <div class="card card-pad">
    <div class="month-nav">
      <button class="icon-btn" data-action="ocal-prev">${icon('chevronLeft')}</button>
      <div class="fw-semibold text-lg">${fmtMonthYear(calCursor)}</div>
      <button class="icon-btn" data-action="ocal-next">${icon('chevronRight')}</button>
    </div>
    <div style="overflow-x:auto;"><table class="cal-table"><thead><tr>${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<th>${d}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(row=>`<tr>${row.map(d=>{
      if(d===null) return '<td class="blank"></td>';
      const dateObj = new Date(y,m,d); const dateStr = toISODate(dateObj);
      const dayAppts = appointments.filter(a=>a.date===dateStr && LIVE_STATUSES.includes(a.status));
      const conflict = findConflicts().some(([x])=>x.date===dateStr);
      const isToday = dateStr===todayISO;
      return `<td><button class="cal-cell ${isToday?'today':''}" style="height:64px; text-align:left; padding:6px;" data-nav="#/owner/day/${dateStr}">
        <div>${d}</div>${dayAppts.length?`<div class="badge ${conflict?'badge-noshow':'badge-accent'}" style="margin-top:4px; padding:1px 6px; font-size:10px;">${dayAppts.length}${conflict?' !':''}</div>`:''}</button></td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>
  </div>
  <p class="muted text-xs" style="margin-top:10px;">Tap a day to see its appointments.</p>`;
}

/* ---------- charts ---------- */
function barChart(labels, values, opts){
  opts = opts||{};
  const w = 560, h = opts.h||180, pad = 28;
  const max = Math.max(1, ...values);
  const bw = (w - pad*2) / values.length - 10;
  const bars = values.map((v,i)=>{
    const bh = (h - pad*2) * (v/max);
    const x = pad + i*((w-pad*2)/values.length);
    const y = h - pad - bh;
    const color = opts.colors ? opts.colors[i%opts.colors.length] : 'var(--chart-1)';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${color}"></rect>
      <text x="${(x+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">${labels[i]}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="11" font-family="var(--font-mono)" fill="var(--foreground)">${v}</text>`;
  }).join('');
  const gridY = [0.25,0.5,0.75].map(f=> pad + (h-pad*2)*(1-f));
  const grid = gridY.map(y=>`<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-pad}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"></line>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">${grid}${bars}</svg>`;
}

/* ================= mutations shared across surfaces ================= */
function createAppointmentRuntime(customerFields, date, time, opts){
  opts = opts || {};
  let c = custByEmail(customerFields.email);
  if(!c){ c = {id:uid('cust'), name:customerFields.name, email:customerFields.email, mobile:customerFields.mobile, firstSeenAt:new Date().toISOString(), notes:'', marketingConsent: !!customerFields.consent}; customers.push(c); }
  const a = { id:uid('apt'), ref:refCode(), customerId:c.id, date, time, status: opts.status||'confirmed',
    source: opts.source||'online', customerNote: customerFields.note||'', ownerNote: opts.ownerNote||'', pricePence:null,
    rescheduledFrom: opts.rescheduledFrom||null, cancellationReason:null, rejectionReason:null,
    createdAt: opts.createdAt || new Date().toISOString() };
  appointments.unshift(a);
  return a;
}
function performReschedule(oldAppt, newDate, newTime){
  oldAppt.status = 'rescheduled';
  const c = cust(oldAppt.customerId);
  const newAppt = createAppointmentRuntime({name:c.name, email:c.email, mobile:c.mobile}, newDate, newTime, {
    status: oldAppt.status==='pending_approval' ? 'pending_approval' : 'confirmed',
    source: oldAppt.source, rescheduledFrom: oldAppt.id, createdAt: oldAppt.createdAt,
  });
  queueEmail('booking_rescheduled', newAppt, {});
  queueEmail('owner_booking_moved', newAppt, {});
  notifications.unshift({id:uid('nt'), type:'booking', text:`${c.name}'s appointment moved to ${fmtDateShort(newDate)}, ${newTime}`, time:new Date().toISOString(), read:true, link:'#/owner/appointments/'+newAppt.id});
  return newAppt;
}
function performCancel(a, reason){
  a.status = 'cancelled'; a.cancellationReason = reason || 'Cancelled';
  queueEmail('booking_cancelled', a, {});
}

/* ================= action + form dispatch ================= */
function handleAction(action, el){
  const d = el.dataset;
  if(action==='cycle-theme') return cycleTheme();

  if(action==='toggle-style'){
    const cur = new Set((draft.styleNote||'').split(',').map(s=>s.trim()).filter(Boolean));
    if(cur.has(d.item)) cur.delete(d.item); else cur.add(d.item);
    draft.styleNote = [...cur].join(', ');
    return render();
  }
  if(action==='cal-prev'){ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); return render(); }
  if(action==='cal-next'){ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); return render(); }
  if(action==='pick-date'){ draft.date=d.date; draft.time=null; return navigate('#/book/time'); }
  if(action==='pick-time'){ draft.time=d.time; return navigate('#/book/details'); }
  if(action==='submit-booking'){
    const a = createAppointmentRuntime({name:draft.name, email:draft.email, mobile:draft.mobile, note:draft.styleNote, consent:draft.consent}, draft.date, draft.time, {status:'confirmed', source:'online'});
    queueEmail('booking_confirmed', a, {});
    queueEmail('owner_new_booking', a, {});
    notifications.unshift({id:uid('nt'), type:'booking', text:`${cust(a.customerId).name} booked ${fmtDateShort(a.date)}, ${a.time}`, time:new Date().toISOString(), read:false, link:'#/owner/appointments/'+a.id});
    resetDraft();
    return navigate('#/book/submitted/'+a.ref);
  }
  if(action==='customer-reschedule'){ const a=apt(d.apt); const na=performReschedule(a, d.date, d.time); toast('Booking moved to '+fmtDateShort(d.date)+', '+d.time, 'success'); return navigate('#/manage/'+na.ref); }
  if(action==='customer-cancel'){ const a=apt(d.apt); performCancel(a,'Cancelled by customer'); toast('Booking cancelled.', 'info'); return render(); }

  if(action==='ocal-prev'){ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); return render(); }
  if(action==='ocal-next'){ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); return render(); }

  if(action==='set-appt-tab'){ apptTab=d.tab; return navigate(d.tab==='requests' ? '#/owner/appointments/requests' : '#/owner/appointments'); }
  if(action==='filter-appt'){ apptFilter=d.key; return render(); }
  if(action==='new-walkin'){ return navigate('#/owner/appointments/new'+(d.date?('/'+d.date):'')); }
  if(action==='approve-appt'){ const a=apt(d.id); a.status='confirmed'; queueEmail('booking_approved', a, {}); toast('Approved — confirmation sent to '+cust(a.customerId).name, 'success'); return render(); }
  if(action==='reject-appt'){ const a=apt(d.id); a.status='rejected'; a.rejectionReason='Not available'; queueEmail('booking_declined', a, {}); toast('Booking declined.', 'info'); return render(); }
  if(action==='transition-appt'){
    const a=apt(d.id); const ns=d.status;
    if(!(LEGAL_NEXT[a.status]||[]).includes(ns)) return;
    a.status = ns;
    if(ns==='cancelled') a.cancellationReason='Cancelled by the owner';
    toast('Marked as '+STATUS_LABEL[ns]+'.', 'success');
    return render();
  }
  if(action==='owner-reschedule'){ const a=apt(d.id); const na=performReschedule(a, d.date, d.time); toast('Rescheduled to '+fmtDateShort(d.date)+', '+d.time, 'success'); return navigate('#/owner/appointments/'+na.id); }

  if(action==='offer-slot'){ const r=reqById(d.id); r.status='offer_sent'; r.offeredDate=d.date; r.offeredTime=d.time; toast('Offer noted — waiting on the customer.', 'info'); return render(); }
  if(action==='accept-offer'){
    const r=reqById(d.id); const c=cust(r.customerId);
    const a = createAppointmentRuntime({name:c.name, email:c.email, mobile:c.mobile}, r.offeredDate, r.offeredTime, {status:'confirmed', source:'online'});
    queueEmail('booking_confirmed', a, {}); queueEmail('owner_new_booking', a, {});
    r.status='converted';
    toast('Booked — '+c.name+' confirmed for '+fmtDateShort(r.offeredDate), 'success');
    return navigate('#/owner/appointments/'+a.id);
  }
  if(action==='decline-request'){ const r=reqById(d.id); r.status='declined'; toast('Request declined.', 'info'); return render(); }

  if(action==='remove-menu-item'){ SERVICE_MENU[+d.cat].items.splice(+d.item,1); return render(); }
  if(action==='remove-template-time'){ const dow=+d.dow; weeklyTemplate[dow]=weeklyTemplate[dow].filter(t=>t!==d.time); return render(); }
  if(action==='toggle-day-closed'){ if(closedDates.has(d.date)) closedDates.delete(d.date); else closedDates.add(d.date); manuallyEdited.add(d.date); return render(); }
  if(action==='remove-slot-time'){ availabilityByDate[d.date]=(availabilityByDate[d.date]||[]).filter(t=>t!==d.time); manuallyEdited.add(d.date); return render(); }
  if(action==='reset-day-template'){ availabilityByDate[d.date]=generateFromTemplate(d.date); closedDates.delete(d.date); manuallyEdited.delete(d.date); toast('Reset to weekly template.', 'info'); return render(); }
  if(action==='apply-template'){
    let n=0;
    for(let i=0;i<businessSettings.publishedHorizonDays;i++){ const dt=toISODate(addDays(today,i)); if(!manuallyEdited.has(dt)){ availabilityByDate[dt]=generateFromTemplate(dt); dayDecided.add(dt); n++; } }
    toast('Template applied to '+n+' day'+(n===1?'':'s')+'.', 'success'); return render();
  }

  if(action==='ai-apply-reschedule'){ const a=apt(d.id); const na=performReschedule(a, d.date, d.time); toast('Appointment moved and customer notified.', 'success'); return navigate('#/owner/appointments/'+na.id); }
  if(action==='ai-generate-draft'){
    const apptSel = document.getElementById('dr-appt'), purposeSel = document.getElementById('dr-purpose');
    const a = apt(apptSel ? apptSel.value : d.id);
    const purpose = purposeSel ? purposeSel.value : 'thank_you';
    if(!a) return;
    const c = cust(a.customerId);
    draftGenerated = { appt:a, text: DRAFT_PURPOSES[purpose].build(a,c) };
    return render();
  }
  if(action==='ai-send-draft'){
    if(!draftGenerated) return;
    const c = cust(draftGenerated.appt.customerId);
    emailQueue.unshift({id:uid('mail'), templateId:null, adhoc:true, appointmentId:draftGenerated.appt.id, to:c.email, subject:'A note from Kokolett Beauty UK', status:'sent', attempts:1, lastError:null, scheduledFor:null, createdAt:new Date().toISOString()});
    toast('Email sent to '+c.name, 'success'); draftGenerated=null; return render();
  }
  if(action==='ai-copy-draft'){
    if(!draftGenerated) return;
    const plain = draftGenerated.text.replace(/<br\s*\/?>/g,'\n').replace(/<[^>]+>/g,'');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(plain).catch(()=>{});
    toast('Draft copied.', 'info'); return;
  }
  if(action==='ai-loyalty-draft'){
    const c = cust(d.id);
    const last = appointments.filter(a=>a.customerId===c.id && a.status==='completed').sort((x,y)=>new Date(y.date)-new Date(x.date))[0];
    if(!last) return;
    emailQueue.unshift({id:uid('mail'), templateId:null, adhoc:true, appointmentId:last.id, to:c.email, subject:'Thank you for being a loyal customer', status:'sent', attempts:1, lastError:null, scheduledFor:null, createdAt:new Date().toISOString()});
    toast('Thank-you email sent to '+c.name, 'success'); return render();
  }

  if(action==='select-message'){ replySelectedId=d.id; generatedReply=null; return render(); }
  if(action==='set-tone'){ replyTone=d.tone; return render(); }
  if(action==='ai-generate-reply'){ const m=customerMessages.find(x=>x.id===d.id); generatedReply=suggestReply(m, replyTone); return render(); }
  if(action==='ai-send-reply'){
    const m=customerMessages.find(x=>x.id===d.id); m.handled=true;
    emailQueue.unshift({id:uid('mail'), templateId:null, adhoc:true, appointmentId:null, to:msgCust(m).email, subject:'Re: your message', status:'sent', attempts:1, lastError:null, scheduledFor:null, createdAt:new Date().toISOString()});
    toast('Reply sent to '+msgCust(m).name, 'success'); generatedReply=null; return render();
  }
  if(action==='ai-send-reminder'){ const a=apt(d.id); queueEmail('reminder_2h', a, {}); toast('Reminder sent to '+cust(a.customerId).name, 'success'); return render(); }

  if(action==='retry-email'){ const m=emailQueue.find(x=>x.id===d.id); m.status='sent'; m.attempts+=1; m.lastError=null; toast('Email resent.', 'success'); return render(); }
  if(action==='revoke-feed'){ const f=calendarFeeds.find(x=>x.id===d.id); f.revokedAt=new Date().toISOString(); toast('Feed revoked.', 'info'); return render(); }

  if(action==='mark-all-read'){ notifications.forEach(n=>n.read=true); return render(); }
  if(action==='open-notif'){ const n=notifications.find(x=>x.id===d.id); n.read=true; return navigate(n.link); }
  if(action==='set-theme'){ setThemePref(d.theme); return render(); }
  if(action==='reset-password'){ toast('Password reset email sent to '+ownerProfile.email, 'success'); return; }
}

function handleInput(target){
  const key = target.dataset.actionInput;
  if(key==='customer-search'){ customerQuery = target.value; return render(); }
}

function handleForm(name, form){
  const fd = new FormData(form);
  if(name==='booking-details'){
    draft.name = fd.get('name').trim(); draft.email = fd.get('email').trim(); draft.mobile = fd.get('mobile').trim(); draft.consent = fd.get('consent')==='on';
    return navigate('#/book/review');
  }
  if(name==='manage-lookup'){
    const ref = (fd.get('ref')||'').trim();
    const email = (fd.get('email')||'').trim().toLowerCase();
    const a = aptByRef(ref);
    if(!a || cust(a.customerId).email.toLowerCase()!==email){ manageErrorMsg = "We couldn't find a booking with that reference and email combination."; return navigate('#/manage'); }
    manageErrorMsg=''; return navigate('#/manage/'+a.ref);
  }
  if(name==='join-waitlist'){
    const name_=(fd.get('name')||'').trim(), email=(fd.get('email')||'').trim(), mobile=(fd.get('mobile')||'').trim(), note=(fd.get('note')||'').trim();
    let c = custByEmail(email);
    if(!c){ c = {id:uid('cust'), name:name_, email, mobile, firstSeenAt:new Date().toISOString(), notes:'', marketingConsent:false}; customers.push(c); }
    const r = {id:uid('req'), customerId:c.id, desiredDate:draft.date, note, status:'new', createdAt:new Date().toISOString(), offeredDate:null, offeredTime:null};
    availabilityRequests.unshift(r);
    const fakeApptForEmail = {customerId:c.id, date:r.desiredDate, ref:''};
    const rendered = renderEmail('request_received', fakeApptForEmail);
    emailQueue.unshift({id:uid('mail'), templateId:'request_received', appointmentId:null, to:c.email, subject:rendered.subject, status:'sent', attempts:1, lastError:null, scheduledFor:null, createdAt:new Date().toISOString()});
    notifications.unshift({id:uid('nt'), type:'request', text:c.name+' joined the waitlist for '+fmtDateShort(r.desiredDate), time:new Date().toISOString(), read:false, link:'#/owner/appointments/requests'});
    return navigate('#/book/waitlisted/'+r.id);
  }
  if(name==='save-note'){
    const c = cust(form.dataset.id); c.notes = (fd.get('note')||'').trim();
    toast('Note saved.', 'success'); return render();
  }
  if(name==='save-bookable'){
    bookableService.name = fd.get('name').trim(); bookableService.durationMin = parseInt(fd.get('duration'),10)||bookableService.durationMin;
    bookableService.bufferMin = parseInt(fd.get('buffer'),10)||bookableService.bufferMin; bookableService.description = fd.get('description').trim();
    toast('Saved.', 'success'); return render();
  }
  if(name==='add-menu-item'){
    const item=(fd.get('item')||'').trim();
    if(item) SERVICE_MENU[+form.dataset.cat].items.push(item);
    return render();
  }
  if(name==='add-template-time'){
    const t=fd.get('time'); const dow=+form.dataset.dow;
    if(t && !weeklyTemplate[dow].includes(t)){ weeklyTemplate[dow].push(t); weeklyTemplate[dow].sort(); }
    return render();
  }
  if(name==='add-slot-time'){
    const t=fd.get('time'); const date=form.dataset.date;
    if(t){ availabilityByDate[date]=availabilityByDate[date]||[]; if(!availabilityByDate[date].includes(t)) availabilityByDate[date].push(t); availabilityByDate[date].sort(); manuallyEdited.add(date); }
    return render();
  }
  if(name==='set-price'){
    const a = apt(form.dataset.id); const v = parseFloat(fd.get('price'));
    a.pricePence = isNaN(v) ? null : Math.round(v*100);
    toast('Price saved.', 'success'); return render();
  }
  if(name==='save-business'){
    businessSettings.businessName=fd.get('name'); businessSettings.addressLine=fd.get('address'); businessSettings.phone=fd.get('phone'); businessSettings.instagramUrl=fd.get('instagram');
    businessSettings.leadTimeMin=parseInt(fd.get('lead'),10)||businessSettings.leadTimeMin;
    businessSettings.maxHorizonDays=parseInt(fd.get('horizon'),10)||businessSettings.maxHorizonDays;
    businessSettings.maxAppointmentsPerDay=parseInt(fd.get('cap'),10)||businessSettings.maxAppointmentsPerDay;
    businessSettings.cancellationWindowH=parseInt(fd.get('cancel'),10)||businessSettings.cancellationWindowH;
    businessSettings.approveFirstTime = fd.get('approveFirstTime')==='on';
    toast('Business settings saved.', 'success'); return render();
  }
  if(name==='create-feed'){
    const label=(fd.get('label')||'').trim()||'New device';
    const raw = 'cf_live_'+Array.from({length:16},()=>Math.floor(Math.random()*16).toString(16)).join('');
    calendarFeeds.push({id:uid('feed'), label, tokenMasked:raw, fetchCount:0, lastFetchedAt:new Date().toISOString(), createdAt:new Date().toISOString(), revokedAt:null});
    newFeedToken = 'https://www.kokolettbeauty.com/calendar-feed/'+raw;
    toast('Calendar feed created.', 'success'); return render();
  }
  if(name==='save-google'){ businessSettings.googleReviewUrl=fd.get('url'); businessSettings.googlePlaceId=fd.get('placeId'); toast('Saved.', 'success'); return render(); }
  if(name==='create-walkin'){
    const name_=(fd.get('name')||'').trim(), email=(fd.get('email')||'').trim(), mobile=(fd.get('mobile')||'').trim(), date=(fd.get('date')||'').trim(), time=fd.get('time');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('Use the format YYYY-MM-DD for the date.', 'error'); return render(); }
    const a = createAppointmentRuntime({name:name_, email, mobile}, date, time, {status:'confirmed', source:'phone', ownerNote:'Added by the owner.'});
    queueEmail('booking_confirmed', a, {});
    toast('Appointment created for '+cust(a.customerId).name, 'success');
    return navigate('#/owner/appointments/'+a.id);
  }
}

document.addEventListener('click', e=>{
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
  const actEl = e.target.closest('[data-action]');
  if(actEl){ e.preventDefault(); handleAction(actEl.getAttribute('data-action'), actEl); return; }
});
document.addEventListener('submit', e=>{
  const form = e.target.closest('form[data-form]');
  if(form){ e.preventDefault(); handleForm(form.getAttribute('data-form'), form); }
});
document.addEventListener('input', e=>{
  if(e.target.dataset && e.target.dataset.actionInput) handleInput(e.target);
});
document.addEventListener('change', e=>{
  if(e.target.id==='dr-appt' || e.target.id==='dr-purpose'){ draftGenerated=null; render(); }
});
</script>
